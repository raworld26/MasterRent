<section class="auth-shell">
    <div class="auth-panel">
        <div class="brand-block">
            <span class="brand-mark">MR</span>
            <div>
                <p class="eyebrow">MasterRent</p>
                <h1>Registrati</h1>
            </div>
        </div>

        <[error]>

        <form class="form-stack" method="post" action="<[register_action]>" novalidate>
            <[csrf_field]>

            <fieldset class="form-group">
                <legend>Tipo di account</legend>
                <label class="check-row"><input type="radio" name="role" value="student" <[student_checked]>> Studente (cerco una stanza)</label>
                <label class="check-row"><input type="radio" name="role" value="landlord" <[landlord_checked]>> Proprietario (pubblico annunci)</label>
            </fieldset>

            <div class="form-grid">
                <div class="form-group">
                    <label for="first_name">Nome</label>
                    <input id="first_name" name="first_name" type="text" value="<[first_name]>" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Cognome</label>
                    <input id="last_name" name="last_name" type="text" value="<[last_name]>" maxlength="100" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="<[email]>" maxlength="190" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefono (facoltativo)</label>
                    <input id="phone" name="phone" type="text" value="<[phone]>" maxlength="30">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="password_confirm">Conferma password</label>
                    <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>
                </div>
            </div>

            <button type="submit">Crea account</button>
        </form>

        <p class="muted">Hai già un account? <a href="<[login_url]>">Accedi</a></p>
    </div>
</section>
