<section class="auth-shell">
    <div class="auth-panel">
        <div class="brand-block">
            <span class="brand-mark">MR</span>
            <div>
                <p class="eyebrow">MasteRent</p>
                <h1>Registrazione</h1>
            </div>
        </div>

        <[error]>

        <form class="form-stack" method="post" action="<[register_action]>" novalidate>
            <[csrf_field]>

            <label for="role">Tipo account</label>
            <select id="role" name="role" required>
                <option value="student" <[student_selected]>>Studente</option>
                <option value="landlord" <[landlord_selected]>>Proprietario</option>
            </select>

            <label for="first_name">Nome</label>
            <input id="first_name" name="first_name" type="text" value="<[first_name]>" maxlength="100" required>

            <label for="last_name">Cognome</label>
            <input id="last_name" name="last_name" type="text" value="<[last_name]>" maxlength="100" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="<[email]>" autocomplete="email" required>

            <label for="phone">Telefono</label>
            <input id="phone" name="phone" type="text" value="<[phone]>" maxlength="30">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

            <label for="password_confirm">Conferma password</label>
            <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>

            <button type="submit">Crea account</button>
        </form>

        <p class="muted auth-switch">Hai gia un account? <a href="<[login_url]>">Accedi</a></p>
    </div>
</section>
