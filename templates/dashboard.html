<section class="dashboard-shell">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">MasterRent</p>
            <h1>Dashboard</h1>
        </div>
        <div class="header-actions">
            <a class="button-secondary" href="<[profile_url]>">Profilo</a>
            <a class="button-secondary" href="<[logout_url]>">Logout</a>
        </div>
    </header>

    <section class="account-summary admin-account-summary">
        <div>
            <span class="summary-label">Utente</span>
            <strong><[user_full_name]></strong>
        </div>
        <div>
            <span class="summary-label">Email</span>
            <strong><[user_email]></strong>
        </div>
    </section>

    <[management_cards]>

    <div class="dashboard-grid admin-dashboard-grid">
        <section class="panel admin-side-panel">
            <div class="panel-heading">
                <h2>Gruppi</h2>
            </div>
            <[group_rows]>
        </section>

        <section class="panel admin-side-panel admin-permissions-panel">
            <div class="panel-heading">
                <h2>Servizi e permessi</h2>
                <p class="panel-subtitle">Riepilogo essenziale delle aree abilitate.</p>
            </div>
            <[service_rows]>
        </section>
    </div>
</section>
