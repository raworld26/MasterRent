<section class="dashboard-shell">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">Account &middot; MasteRent</p>
            <h1>Profilo</h1>
        </div>
        <a class="button-secondary" href="<[back_url]>">Area riservata</a>
    </header>

    <section class="account-summary">
        <div>
            <span class="summary-label">Creato il</span>
            <strong><[created_at]></strong>
        </div>
        <div>
            <span class="summary-label">Ultimo accesso</span>
            <strong><[last_login_at]></strong>
        </div>
    </section>

    <[notice]>
    <[error]>

    <section class="panel form-panel">
        <div class="panel-heading">
            <h2>Dati account</h2>
            <p class="panel-subtitle">Aggiorna i dati personali e, se serve, cambia la password.</p>
        </div>

        <form class="form-standard" method="POST" action="<[action_url]>">
            <[csrf_field]>

            <div class="form-grid">
                <div class="form-group">
                    <label for="first_name">Nome</label>
                    <input id="first_name" name="first_name" type="text" value="<[first_name]>" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Cognome</label>
                    <input id="last_name" name="last_name" type="text" value="<[last_name]>" maxlength="100" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="<[email]>" maxlength="190" required>
                </div>
                <div class="form-group">
                    <label for="phone">Telefono</label>
                    <input id="phone" name="phone" type="text" value="<[phone]>" maxlength="30">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="current_password">Password attuale</label>
                    <input id="current_password" name="current_password" type="password" autocomplete="current-password">
                    <small>Obbligatoria solo per cambiare password.</small>
                </div>
                <div class="form-group">
                    <label for="new_password">Nuova password</label>
                    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8">
                </div>
                <div class="form-group">
                    <label for="new_password_confirm">Conferma nuova password</label>
                    <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="8">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="button-primary">Salva profilo</button>
            </div>
        </form>
    </section>
</section>
