<section class="auth-shell">
    <div class="auth-panel">
        <div class="brand-block">
            <span class="brand-mark">MR</span>
            <div>
                <p class="eyebrow">MasterRent</p>
                <h1>Accesso</h1>
            </div>
        </div>

        <[error]>

        <form class="form-stack" method="post" action="<[login_action]>" novalidate>
            <[csrf_field]>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" value="<[email]>" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Accedi</button>
        </form>

        <p class="muted">Non hai un account? <a href="<[register_url]>">Registrati</a></p>
    </div>
</section>
