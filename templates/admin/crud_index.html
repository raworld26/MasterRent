<section class="dashboard-shell">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">Amministrazione &middot; MasteRent</p>
            <h1><[title]></h1>
        </div>
        <div class="header-actions">
            <a class="button-secondary" href="<[back_url]>">Dashboard</a>
            <a class="button-primary" href="<[create_url]>"><[create_label]></a>
        </div>
    </header>

    <[notice]>

    <div class="panel admin-list-panel">
        <div class="panel-heading">
            <h2><[subtitle]></h2>
        </div>
        <div class="table-responsive">
            <table class="data-table admin-data-table">
                <thead>
                    <tr><[table_head]></tr>
                </thead>
                <tbody>
                    <[table_rows]>
                </tbody>
            </table>
        </div>
    </div>
</section>
