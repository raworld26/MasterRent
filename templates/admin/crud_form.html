<section class="dashboard-shell">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">Amministrazione &middot; MasterRent</p>
            <h1><[title]></h1>
        </div>
        <a class="button-secondary" href="<[back_url]>">Annulla</a>
    </header>

    <div class="panel form-panel admin-form-panel">
        <div class="panel-heading">
            <h2><[subtitle]></h2>
        </div>

        <[error]>

        <form action="<[action_url]>" method="POST" class="form-standard"<[form_attrs]>>
            <[csrf_field]>
            <[form_fields]>
            <div class="form-actions admin-form-actions">
                <button type="submit" class="button-primary"><[submit_label]></button>
            </div>
        </form>
    </div>
</section>
