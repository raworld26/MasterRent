<section class="dashboard-shell">
    <header class="dashboard-header">
        <div>
            <p class="eyebrow">Amministrazione &middot; MasteRent</p>
            <h1>Nuovo Quartiere</h1>
        </div>
        <a class="button-secondary" href="<[back_url]>">Annulla e Torna</a>
    </header>

    <div class="panel form-panel admin-form-panel">
        <div class="panel-heading">
            <h2>Dati del quartiere</h2>
            <p class="panel-subtitle">Compila il modulo per registrare una nuova area geografica di L'Aquila.</p>
        </div>

        <[error]>

        <form action="<[action_url]>" method="POST" class="form-standard">
            <[csrf_field]>

            <div class="form-group">
                <label for="name">Nome Quartiere <span class="required">*</span></label>
                <input type="text" id="name" name="name" value="<[name]>" placeholder="Es. Pettino, Centro Storico, Pile" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="code">Codice Alias (opzionale - generato automaticamente se vuoto)</label>
                <input type="text" id="code" name="code" value="<[code]>" placeholder="Es. pettino, centro_storico (lettere minuscole e underscore)">
                <small class="form-help">Utilizzato per identificare in modo univoco il quartiere a sistema ed ottimizzare le ricerche.</small>
            </div>

            <div class="form-group">
                <label for="description">Descrizione e Note logistiche</label>
                <textarea id="description" name="description" rows="5" placeholder="Inserisci info su servizi, fermate dell'autobus e collegamenti universitari..."><[description]></textarea>
            </div>

            <div class="form-actions admin-form-actions">
                <button type="submit" class="button-primary">Salva Quartiere</button>
            </div>
        </form>
    </div>
</section>
