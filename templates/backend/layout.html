<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><[title]> · <[app_name]> Admin</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="<[assets_url]>/img/favicon.svg" type="image/svg+xml">
    <script>
        /* Tema: applica la preferenza salvata (o quella di sistema) prima del CSS. */
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('masterent-theme'); } catch (e) {}
            var theme = saved === 'dark' || saved === 'light'
                ? saved
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        }());
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="<[assets_url]>/css/backend.css">
</head>
<body class="admin <[body_class]>">
    <a class="skip-link" href="#contenuto">Salta al contenuto</a>
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <a class="admin-brand" href="<[dashboard_url]>">
                <span class="admin-brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" focusable="false">
                        <path d="M4 21 10.5 8l5.5 8 5.5-8L28 21h-3.4l-3.1-6.4L16 22.6l-5.5-8L7.4 21H4Z"/>
                        <path d="M13.4 24.5h5.2V28h-5.2z"/>
                    </svg>
                </span>
                <span><[app_name]><small>Admin</small></span>
            </a>
            <nav class="admin-menu" aria-label="Menu amministrazione">
                <[foreach]>
                    <a class="admin-menu-item <[menu_active]>" href="<[menu_url]>"><[menu_label]></a>
                <[/foreach]>
            </nav>
            <a class="admin-site-link" href="<[site_url]>">Apri sito pubblico</a>
        </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <h1 class="admin-title"><[title]></h1>
                <div class="admin-user">
                    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Attiva o disattiva il tema scuro">
                        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    </button>
                    <span class="admin-user-name"><[user_name]></span>
                    <form method="post" action="<[logout_url]>" class="inline-form">
                        <[logout_csrf]>
                        <button class="button button-ghost" type="submit">Esci</button>
                    </form>
                </div>
            </header>

            <main class="admin-content" id="contenuto">
                <[flashes]>
                <[content]>
            </main>
        </div>
    </div>

    <script src="<[assets_url]>/js/validation.js" defer></script>
    <script src="<[assets_url]>/js/filter-ui.js" defer></script>
    <script src="<[assets_url]>/js/toasts.js" defer></script>
    <script src="<[assets_url]>/js/ui.js" defer></script>
</body>
</html>
