<div class="request-list">
    <[foreach]>
    <div class="request-item">
        <a class="request-row" href="<[req_url]>">
            <div class="request-main">
                <strong><[req_room]></strong>
                <span class="muted"><[req_sub]></span>
            </div>
            <div class="request-date"><[req_date]></div>
            <div class="request-status"><[req_status]></div>
        </a>
        <[req_cta]>
    </div>
    <[/foreach]>
</div>
