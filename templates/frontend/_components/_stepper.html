<ol class="stepper <[stepper_modifier]>" aria-label="Stato della richiesta: <[stepper_current_label]>">
    <[foreach]>
    <li class="stepper__step <[step_state]>" <[step_aria]>>
        <span class="stepper__dot" aria-hidden="true"><[step_dot]></span>
        <span class="stepper__label"><[step_label]></span>
    </li>
    <[/foreach]>
</ol>
